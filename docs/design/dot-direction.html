function rest(){return `<div class="rest" role="status">${icon('timer')}<div class="rest-main"><span class="muted">Rest</span><strong id="rest-clock">${restText()}</strong></div><button class="button" data-action="skiprest">Skip</button></div>`}
function restText(){const s=Math.max(0,Math.ceil((state.restEnd-Date.now())/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function sheet(){const type=state.sheet;let inner='';if(type==='choose'||type==='review'||type==='count'){inner=`<div class="top"><h2>${type==='choose'?'Choose workout':'Your workout'}</h2><button class="iconbutton" data-action="close" aria-label="Close workout review">${icon('close')}</button></div><div class="choices">${Object.keys(catalog).map(g=>`<button class="choice" data-group="${g}" aria-pressed="${g===state.group}">${glyph(glyphName(g))}<span>${g}</span></button>`).join('')}</div><div class="row" style="margin-bottom:12px"><h3>Exercises</h3><div class="row"><button class="iconbutton" data-count="-1" ${state.count<=1?'disabled':''} aria-label="Fewer exercises">${icon('minus')}</button><strong class="numeric">${state.count}</strong><button class="iconbutton" data-count="1" ${state.count>=3?'disabled':''} aria-label="More exercises">${icon('plus')}</button></div></div>${catalog[state.group].slice(0,state.count).map((e,i)=>`<div class="planrow"><span class="ordinal">${i+1}</span><div><strong>${e[0]}</strong><p class="muted">${e[1]}</p></div><span class="muted">3 sets</span></div>`).join('')}<div class="setup"><label for="gym">Today's gym</label><input id="gym" value="${safe(state.gym)}" placeholder="Gym not specified"><p class="muted" style="margin-top:8px">Same equipment? Previous weights are a reference.</p></div><button class="button primary wide" data-action="start">Start workout ${icon('arrow')}</button>`}
else if(type==='finish'){inner=`<div class="top"><h2>Finish workout?</h2><button class="iconbutton" data-action="close" aria-label="Keep logging">${icon('close')}</button></div><p class="finishcount">${totalActual()} sets logged</p><p class="muted">${totalActual()<state.current.exercises.length*3?'Unperformed sets stay unrecorded. Your plan remains unchanged.':'All planned sets are logged.'}</p><div class="stack" style="margin-top:24px"><button class="button primary wide" data-action="complete">Finish example workout</button><button class="button wide" data-action="close">Keep logging</button></div>`}
else if(type==='progress'){inner=`<div class="top"><h2>Bench press</h2><button class="iconbutton" data-action="close" aria-label="Close progress">${icon('close')}</button></div><p class="muted" style="margin-bottom:20px">Proposed trend · illustrative records, future history view</p><div class="row"><div><p class="muted">First record</p><h3>60 kg × 8</h3></div><div><p class="muted">Latest record</p><h3>60 kg × 10</h3></div></div><svg class="chart" viewBox="0 0 320 160" role="img" aria-label="Example bench press repetitions increase from 8 to 10 at 60 kilograms"><path class="grid" d="M12 25h290M12 80h290M12 135h290"/><path class="trend" d="M20 132 110 132 205 80 300 25"/><circle cx="20" cy="132" r="5"/><circle cx="110" cy="132" r="5"/><circle cx="205" cy="80" r="5"/><circle cx="300" cy="25" r="5"/></svg><div class="dateaxis"><span>28 Sep</span><span>17 Oct</span></div><div class="row" style="margin-top:24px"><h3>2 more reps</h3><span style="color:var(--accent)">${icon('up').replace('<svg ','<svg width="24" height="24" ')}</span></div><p class="muted" style="margin-top:12px">Same gym, barbell and rep target. Recorded effort similar. Example records; not a measurement of muscle growth.</p>`}
else if(type==='settings'){inner=`<div class="top"><h2>Design study</h2><button class="iconbutton" data-action="close" aria-label="Close settings">${icon('close')}</button></div><p>Example records only. Changes exist in this page's memory and disappear on reload.</p><p class="muted" style="margin-top:12px">No database, analytics, remote images or workout storage are used.</p><button class="button wide" style="margin-top:24px" data-action="reset">Reset example</button>`}
else if(type==='swap'){const e=currentEx(),alt=alternatives[e.name]||['Alternative '+e.name,e.equipment,e.reference];inner=`<div class="top"><h2>Machine busy?</h2><button class="iconbutton" data-action="close" aria-label="Cancel swap">${icon('close')}</button></div><p class="muted">Keep the same target. Review the new setup and load.</p><div class="planrow"><span class="liftmark">${icon('up')}</span><div><h3>${safe(alt[0])}</h3><p class="muted">${safe(alt[1])} · ${state.group}</p></div></div><p class="muted" style="margin-top:16px">${e.sets.length?'Logged sets keep their original exercise. Swap affects remaining sets only.':'Unlogged numbers are cleared for the replacement.'}</p><button class="button primary wide" style="margin-top:24px" data-action="confirmswap">Use this exercise ${icon('swap')}</button>`}
else if(type==='edit'){const s=currentEx().sets[state.editIndex];inner=`<div class="top"><h2>Edit set ${state.editIndex+1}</h2><button class="iconbutton" data-action="close" aria-label="Cancel correction">${icon('close')}</button></div><div class="setup"><label for="edit-weight">Weight · kg</label><input type="number" inputmode="decimal" min="0" step="0.5" id="edit-weight" value="${s.weight}"></div><div class="setup"><label for="edit-reps">Reps</label><input type="number" inputmode="numeric" min="1" step="1" id="edit-reps" value="${s.reps}"></div><p class="error" role="alert" id="edit-error"></p><button class="button primary wide" data-action="saveedit">Apply correction</button>`}
return `<div class="sheetbackdrop"><section class="sheet" role="dialog" aria-modal="true" aria-label="${safe(type)}"><div class="handle" aria-hidden="true"></div>${inner}</section></div>`}
let previousSheet=null,returnAction=null;
function render(){state.visits=12+(state.todayRecorded?1:0);const opening=state.sheet&&previousSheet!==state.sheet,closing=!state.sheet&&previousSheet;app.innerHTML=(state.scene==='home'?home():workout())+(state.sheet?sheet():'');updateTimer();if(opening){const first=app.querySelector('[role=dialog] button:not(:disabled),[role=dialog] input');if(first)first.focus({preventScroll:true});}else if(closing&&returnAction){const origin=app.querySelector('[data-action="'+returnAction+'"]');if(origin)origin.focus({preventScroll:true});}previousSheet=state.sheet;}
function start(){state.current={group:state.group,gym:state.gym,exercises:catalog[state.group].slice(0,state.count).map(e=>({name:e[0],equipment:e[1],reference:e[2],sets:[]}))};state.index=0;state.weight=currentEx().reference;state.reps=8;state.scene='workout';state.sheet=null;state.lastLogged=null;state.error='';window.scrollTo(0,0)}
function nextExercise(delta){state.index=Math.max(0,Math.min(state.current.exercises.length-1,state.index+delta));state.weight=currentEx().reference;state.reps=8;state.error='';state.lastLogged=null;state.restEnd=0;state.showEffort=false;window.scrollTo(0,0)}
function updateTimer(){clearInterval(restTimer);if(state.restEnd){restTimer=setInterval(()=>{const el=document.getElementById('rest-clock');if(el)el.textContent=restText();if(Date.now()>=state.restEnd){state.restEnd=0;clearInterval(restTimer);render()}},300)}}
app.addEventListener('input',e=>{if(e.target.id==='weight')state.weight=e.target.value;if(e.target.id==='reps')state.reps=e.target.value;if(e.target.id==='gym')state.gym=e.target.value;if(e.target.id==='effort'){state.effort=Number(e.target.value);if(state.lastLogged)state.lastLogged.set.effort=state.effort;const v=document.getElementById('effortvalue');v.textContent=state.effort===4?'4+ good-form reps':state.effort+' good-form '+(state.effort===1?'rep':'reps')}});
app.addEventListener('change',e=>{if(e.target.id==='rest-toggle'){state.restOn=e.target.checked;if(!state.restOn){state.restEnd=0;render()}}else if(e.target.id==='effort'){render();document.getElementById('effort')?.focus({preventScroll:true});}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.step){const key=b.dataset.step;state[key]=Math.max(key==='reps'?1:0,Number(state[key])+Number(b.dataset.delta));render();return}if(b.dataset.group){state.group=b.dataset.group;render();return}if(b.dataset.count){state.count=Math.min(3,Math.max(1,state.count+Number(b.dataset.count)));render();return}if(b.dataset.edit!==undefined){state.editIndex=Number(b.dataset.edit);state.sheet='edit';render();return}if(b.dataset.effort!==undefined){state.effort=Number(b.dataset.effort);if(state.lastLogged)state.lastLogged.set.effort=state.effort;render();return;}const a=b.dataset.action;if(['choose','review','count','settings','progress','finish','swap'].includes(a))returnAction=a;
if(['choose','review','count','settings','progress','finish','swap'].includes(a))state.sheet=a;
else if(a==='close')state.sheet=null;
else if(a==='start')start();
else if(a==='home'){state.scene='home';state.lastLogged=null;window.scrollTo(0,0)}
else if(a==='resume'){state.scene='workout';window.scrollTo(0,0)}
else if(a==='prefill'){state.weight=currentEx().reference;state.reps=8}
else if(a==='log'){const w=Number(state.weight),r=Number(state.reps);if(state.weight===''||state.reps===''||!Number.isFinite(w)||w<0||!Number.isInteger(r)||r<1||r>100){state.error='Enter a weight and whole reps from 1 to 100.'}else{const s={weight:w,reps:r,effort:null,exerciseName:currentEx().name,equipment:currentEx().equipment};currentEx().sets.push(s);state.lastLogged={exercise:state.index,set:s};state.effort=null;state.showEffort=false;state.error='';if(state.restOn)state.restEnd=Date.now()+90000}}
else if(a==='effort')state.showEffort=!state.showEffort;
else if(a==='effortskip'){state.effort=null;state.lastLogged.set.effort=null;state.showEffort=false}
else if(a==='skiprest')state.restEnd=0;
else if(a==='next')nextExercise(1);
else if(a==='previous')nextExercise(-1);
else if(a==='complete'){if(totalActual()>0)state.todayRecorded=true;state.current=null;state.scene='home';state.sheet=null;state.lastLogged=null;state.restEnd=0;window.scrollTo(0,0)}
else if(a==='confirmswap'){const ex=currentEx(),alt=alternatives[ex.name]||['Alternative '+ex.name,ex.equipment,ex.reference];ex.original=ex.name;ex.name=alt[0];ex.equipment=alt[1];ex.reference=alt[2];ex.swapped=true;state.weight='';state.reps=8;state.sheet=null;state.lastLogged=null}
else if(a==='saveedit'){const w=Number(document.getElementById('edit-weight').value),r=Number(document.getElementById('edit-reps').value);if(!Number.isFinite(w)||w<0||!Number.isInteger(r)||r<1||r>100){document.getElementById('edit-error').textContent='Enter a valid weight and whole repetitions.';return}const s=currentEx().sets[state.editIndex];s.weight=w;s.reps=r;state.sheet=null}
else if(a==='reset'){location.reload();return}render()});
document.getElementById('reset').addEventListener('click',()=>location.reload());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.sheet){state.sheet=null;render();return;}if(e.key==='Tab'&&state.sheet){const items=Array.from(app.querySelectorAll('[role=dialog] button:not(:disabled),[role=dialog] input')).filter(el=>el.offsetParent!==null);if(!items.length)return;const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
render();
</script></body></html>
